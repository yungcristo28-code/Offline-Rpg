name: Compilar APK grátis

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    # Repositórios públicos usam runners padrão gratuitamente.
    # Não use runners "larger"/premium neste workflow.
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android SDK 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK Debug
        run: gradle --no-daemon assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Igor-Offline-RPG-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
